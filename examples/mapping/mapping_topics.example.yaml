# Algorithm service only. Camera, lidar and chassis ROS publishers run separately.
mapping:
  name: mapping
  database: ../assets/mapping/manual/rtabmap.db
  topics:
    points: /iv_points
    camera_prefix: /rsim/d435
    imu: /rsim/chassis/imu/data
    odom: /rsim/chassis/odom
    scan: /rsim/chassis/scan_raw
  # Replace all three mounts with measured graphmap poses.
  mounts:
    body_lidar:
      wrd_frame: base_footprint
      ego_frame: lidar3d
      position: [0, 0, 0]
      rotation: [0, 0, 0, 1]
    body_imu:
      wrd_frame: base_footprint
      ego_frame: imu_frame
      position: [0, 0, 0]
      rotation: [0, 0, 0, 1]
    body_camera:
      wrd_frame: base_footprint
      ego_frame: d435_link
      position: [0, 0, 0]
      rotation: [0, 0, 0, 1]
  timing:
    lidar: {offset_s: 0.0}  # actual device-clock -> ROS system-time offset
    chassis: {offset_s: 0.0}
  map_options:
    keyframe_hz: 1.0  # Upper bound, including when accelerating or rotating.
    adaptive_keyframes:
      min_hz: 0.1  # One candidate every 10 seconds at rest.
      linear_speed_m_s: 0.3  # Either speed reaches the upper bound.
      angular_speed_rad_s: 0.5
      window_s: 0.5
      linear_deadband_m_s: 0.01
      angular_deadband_rad_s: 0.02

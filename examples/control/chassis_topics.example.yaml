# Controller host: topic names and algorithm settings only; no hardware ports.
chassis:
  directory: ../assets/chassis-controller
  estimator: wheel_imu
  relay_transport: {backend: cyclonedds, domain_id: 0}
  stm32: {namespace: /rsim/chassis}
  imu: {topic: /rsim/chassis/imu/data}
  imu_mount:
    wrd_frame: base_footprint
    ego_frame: imu_frame
    position: [0, 0, 0]  # replace with measured mount
    rotation: [0, 0, 0, 1]
  # To use scan_imu, start the lidar independently and add these fields:
  # scan:
  #   topic: /rsim/chassis/scan_raw
  #   filter:
  #     topic: /rsim/chassis/scan
  #     angle_masks: []  # measured self-occlusion sectors, radians
  # scan_mount:
  #   wrd_frame: base_footprint
  #   ego_frame: laser_frame
  #   position: [0, 0, 0]
  #   rotation: [0, 0, 0, 1]
  odometry:
    prefix: /rsim/chassis_odometry
    world_frame: odom_fused
    input_timeout: 0.3
    parameters: {frequency: 50.0}
  control:
    command_ttl: 0.2
    pose_timeout: 0.3
    max_linear: 0.2
    max_angular: 0.4

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsim"
version = "0.2.0"
description = "Async composable sensors over DDS with optional ROS 2 drivers"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "cloudpickle>=3"]

[project.optional-dependencies]
dds = ["cyclonedds>=0.10.5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

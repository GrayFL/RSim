[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsim"
version = "0.1.0"
description = "Async composable sensor prototype over ROS 2"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "cloudpickle>=3"]

[tool.setuptools.packages.find]
include = ["rsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

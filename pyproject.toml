[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsim"
version = "0.3.0"
description = "Async robot components, time-indexed signals and command ports with ROS adapters"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "cloudpickle>=3"]

[project.optional-dependencies]
imu = ["pyserial>=3.5", "graphmap>=0.1.0"]
config = ["PyYAML>=6", "graphmap>=0.1.0"]
motion = ["graphmap>=0.1.0", "threadpoolctl>=3"]
mapping = ["PyYAML>=6", "graphmap>=0.1.0", "opencv-python>=4.8"]
dds = ["cyclonedds>=0.10.5"]
test = ["pytest>=8"]
teleop = ["pynput>=1.7", "PyYAML>=6", "graphmap>=0.1.0", "cyclonedds>=0.10.5", "threadpoolctl>=3"]
notebook = ["ipywidgets>=8"]

[tool.setuptools.packages.find]
include = ["rsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

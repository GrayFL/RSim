[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsim"
version = "0.3.0"
description = "Async robot components, time-indexed signals and command ports with ROS adapters"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "cloudpickle>=3"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.3"]
imu = ["pyserial>=3.5", "graphmap>=0.1.0"]
config = ["PyYAML>=6", "graphmap>=0.1.0"]
motion = ["graphmap>=0.1.0", "threadpoolctl>=3"]
mapping = ["PyYAML>=6", "graphmap>=0.1.0", "opencv-python>=4.8"]
dds = ["cyclonedds>=0.10.5"]
test = ["pytest>=8", "psutil>=5.9"]
teleop = ["pynput>=1.7", "pygame>=2.5", "python-xlib>=0.33; sys_platform == 'linux'", "PyYAML>=6", "graphmap>=0.1.0", "cyclonedds>=0.10.5", "threadpoolctl>=3"]
notebook = ["ipywidgets>=8"]
navigation = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "Pillow>=10", "scipy>=1.17", "threadpoolctl>=3", "graphmap>=0.1.0"]

[tool.setuptools.packages.find]
include = ["rsim*"]

[tool.setuptools.package-data]
"rsim.apps.navigation" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
